<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Организатор — DESIGN TRAVEL CLUB</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #2b3e35;
            padding: 2rem;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .card {
            background: white;
            border-radius: 2rem;
            padding: 1.75rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        h2 {
            color: #1a4d3e;
            margin-bottom: 1rem;
        }
        button {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 2rem;
            border: 1px solid #ccc;
            font-size: 1rem;
            background: #4d7963;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #eaf5f0; }
        .hidden { display: none; }
        .winner-area {
            background: linear-gradient(135deg, #e2f4ed, #c8e6d9);
            border-radius: 1.5rem;
            padding: 1.5rem;
            text-align: center;
            margin-top: 1rem;
        }
        .winner-name {
            font-size: 2rem;
            font-weight: bold;
            color: #1a4d3e;
            margin: 0.5rem 0;
        }
        .flex-buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }
        .flex-buttons button {
            flex: 1;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card" id="loginCard">
        <h2>🔐 Вход организатора</h2>
        <input type="password" id="adminPassword" placeholder="Пароль" style="width:100%; padding:0.8rem; border-radius:2rem; margin-bottom:0.5rem;">
        <button id="loginBtn">Войти</button>
        <div id="loginError" style="color: #bc4e4e; margin-top:0.5rem;"></div>
    </div>

    <div id="adminPanel" class="card hidden">
        <h2>🌿 Розыгрыш</h2>
        <div style="margin-bottom: 1rem;">
            <label style="display: inline-block; margin-right: 1rem;">🎁 Призов:</label>
            <select id="prizeCount" style="width: auto; padding: 0.5rem 1rem;">
                <option value="1">1 приз</option>
                <option value="2" selected>2 приза</option>
                <option value="3">3 приза</option>
                <option value="5">5 призов</option>
            </select>
        </div>
        <button id="drawBtn">🎲 РАЗЫГРАТЬ СЛЕДУЮЩИЙ ПРИЗ</button>
        <div id="drawStatus" style="background:#eaf5f0; padding:0.75rem; border-radius:2rem; margin-top:0.5rem; text-align:center;">Статус: ожидание</div>
        <div id="winnerArea" class="winner-area hidden"></div>
        
        <div class="flex-buttons">
            <button id="resetDrawBtn">🔄 Сбросить розыгрыш</button>
            <button id="refreshBtn">🔄 Обновить список</button>
            <button id="logoutBtn">🚪 Выйти</button>
        </div>
        
        <h3 style="margin-top:1rem;">📋 Участники</h3>
        <div style="overflow-x:auto;">
            <table id="participantsTable">
                <thead><tr><th>№</th><th>Имя</th><th>Фамилия</th><th>Телефон</th></tr></thead>
                <tbody id="userTable"><tr><td colspan="4">Загрузка...<\/td><\/tr><\/tbody>
            20~
        </div>
    </div>
</div>

<script>
    const PASSWORD = "travelclub2025";
    const SHEET_ID = '1wN9aTVvbnmTwijUvRF21toueWWjmeUsUeQDCpQvZqEE';
    
    let participants = [];
    let winners = [];
    let available = [];
    let isAdmin = false;
    
    async function loadUsers() {
        const tbody = document.getElementById('userTable');
        if (tbody) tbody.innerHTML = '<tr><td colspan="4">Загрузка...<\/td><\/tr>';
        try {
            const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;
            const res = await fetch(url);
            const text = await res.text();
            const json = JSON.parse(text.substring(47, text.length - 2));
            const rows = json.table.rows;
            
            if (!rows || rows.length < 2) {
                participants = [];
                if (tbody) tbody.innerHTML = '<tr><td colspan="4">Нет участников<\/td><\/tr>';
                return;
            }
            
            participants = [];
            for (let i = 1; i < rows.length; i++) {
                const r = rows[i].c;
                if (r && r[0] && r[0].v) {
                    participants.push({
                        id: i,
                        firstName: r[1]?.v || '',
                        lastName: r[2]?.v || '',
                        phone: r[3]?.v || ''
                    });
                }
            }
            
            if (tbody) {
                tbody.innerHTML = '';
                participants.forEach((p, idx) => {
                    tbody.innerHTML += `<tr><td>${idx + 1}</td><td>${p.firstName}</td><td>${p.lastName}</td><td>${p.phone}</td></tr>`;
                });
            }
            
            const winnerIds = winners.map(w => w.id);
            available = participants.filter(p => !winnerIds.includes(p.id));
            updateStatus();
        } catch(err) {
            console.error(err);
            if (tbody) tbody.innerHTML = '<tr><td colspan="4">Ошибка загрузки<\/td><\/tr>';
        }
    }
    
    function updateStatus() {
        const total = parseInt(document.getElementById('prizeCount').value);
        const left = total - winners.length;
        const div = document.getElementById('drawStatus');
        if (winners.length >= total) div.innerHTML = '✅ Розыгрыш завершён!';
        else if (available.length === 0) div.innerHTML = '⚠️ Нет участников для розыгрыша';
        else div.innerHTML = `🎲 Осталось ${left} призов | Доступно ${available.length} участников`;
    }
    
    function showWinner(winner, prizeNum) {
        const winnerDiv = document.getElementById('winnerArea');
        winnerDiv.innerHTML = `
            <div style="background:linear-gradient(135deg,#e2f4ed,#c8e6d9); border-radius:1.5rem; padding:1.5rem; text-align:center;">
                <h2>🏆 ПРИЗ №${prizeNum} 🏆</h2>
                <div class="winner-name">${winner.firstName} ${winner.lastName}</div>
                <div style="margin-top:0.5rem;">✨ Поздравляем! ✨</div>
            </div>
        `;
        winnerDiv.classList.remove('hidden');
        
        // Отправляем на экран зрителей
        localStorage.setItem('winnerDisplay', JSON.stringify({
            name: `${winner.firstName} ${winner.lastName}`,
            prize: prizeNum,
            time: Date.now()
        }));
    }
    
    function drawWinner() {
        const total = parseInt(document.getElementById('prizeCount').value);
        if (winners.length >= total) {
            alert('Все призы разыграны');
            updateStatus();
            return;
        }
        if (available.length === 0) {
            alert('Нет участников для розыгрыша');
            updateStatus();
            return;
        }
        const randomIndex = Math.floor(Math.random() * available.length);
        const winner = available[randomIndex];
        available.splice(randomIndex, 1);
        winners.push(winner);
        showWinner(winner, winners.length);
        updateStatus();
    }
    
    document.getElementById('loginBtn').onclick = () => {
        if (document.getElementById('adminPassword').value === PASSWORD) {
            isAdmin = true;
            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('adminPanel').classList.remove('hidden');
            loadUsers();
        } else {
            document.getElementById('loginError').innerHTML = 'Неверный пароль';
            setTimeout(() => document.getElementById('loginError').innerHTML = '', 2000);
        }
    };
    
    document.getElementById('logoutBtn').onclick = () => {
        isAdmin = false;
        document.getElementById('loginCard').classList.remove('hidden');
        document.getElementById('adminPanel').classList.add('hidden');
    };
    
    document.getElementById('drawBtn').onclick = drawWinner;
    document.getElementById('resetDrawBtn').onclick = () => {
        winners = [];
        loadUsers();
    };
    document.getElementById('refreshBtn').onclick = loadUsers;
</script>
</body>
</html>
