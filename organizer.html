<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Организатор — DESIGN TRAVEL CLUB</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #2b3e35;
            padding: 2rem;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .card {
            background: white;
            border-radius: 2rem;
            padding: 1.75rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        h2 {
            color: #1a4d3e;
            margin-bottom: 1rem;
        }
        input, button, select {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 2rem;
            border: 1px solid #ccc;
            font-size: 1rem;
            margin-bottom: 0.5rem;
        }
        button {
            background: #4d7963;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #eaf5f0; }
        .hidden { display: none; }
        .error { color: #bc4e4e; margin-top: 0.5rem; }
        .winner-area {
            background: linear-gradient(135deg, #e2f4ed, #c8e6d9);
            border-radius: 1.5rem;
            padding: 1.5rem;
            text-align: center;
            margin-top: 1rem;
        }
        .winner-number { font-size: 2.5rem; font-weight: bold; color: #1a4d3e; }
        .flex-buttons { display: flex; gap: 1rem; flex-wrap: wrap; }
        .flex-buttons button { flex: 1; }
    </style>
</head>
<body>
<div class="container">
    <div class="card" id="loginCard">
        <h2>🔐 Вход организатора</h2>
        <input type="password" id="adminPassword" placeholder="Пароль">
        <button id="loginBtn">Войти</button>
        <div id="loginError" class="error"></div>
    </div>

    <div id="adminPanel" class="card hidden">
        <h2>🌿 Управление розыгрышем</h2>
        <div style="display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem;">
            <select id="prizeCount" style="width: auto; flex:1;">
                <option value="1">1 приз</option>
                <option value="2" selected>2 приза</option>
                <option value="3">3 приза</option>
                <option value="5">5 призов</option>
            </select>
            <button id="drawBtn" style="flex:2;">🎲 РАЗЫГРАТЬ СЛЕДУЮЩИЙ ПРИЗ</button>
        </div>
        <div id="drawStatus" style="background:#eaf5f0; padding:0.75rem; border-radius:2rem; margin-top:0.5rem;">Статус: ожидание</div>
        <div id="winnerAnnouncement" class="winner-area hidden"></div>

        <h3 style="margin-top: 1.5rem;">📋 Участники</h3>
        <button id="refreshBtn" style="margin-bottom: 1rem; background:#8db3a2;">🔄 Обновить список</button>
        <div style="overflow-x:auto;">
            <table id="participantsTable">
                <thead><tr><th>№</th><th>Имя</th><th>Фамилия</th><th>Телефон</th></tr></thead>
                <tbody id="userTable"><tr><td colspan="4">Загрузка...</td></tr></tbody>
            </table>
        </div>
        
        <div class="flex-buttons">
            <button id="logoutBtn" style="background:#b1c5bb; color:#2b4b3e;">🚪 Выйти</button>
        </div>
    </div>
</div>

<script>
    const PASSWORD = "travelclub2025";
    const SHEET_ID = '1wN9aTVvbnmTwijUvRF21toueWWjmeUsUeQDCpQvZqEE';
    
    let users = [];
    let winners = [];
    let available = [];
    let isAdmin = false;
    
    async function loadUsers() {
        const tbody = document.getElementById('userTable');
        if (tbody) tbody.innerHTML = '<tr><td colspan="4">Загрузка...</td></tr>';
        try {
            const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;
            const res = await fetch(url);
            const text = await res.text();
            const json = JSON.parse(text.substring(47, text.length - 2));
            const rows = json.table.rows;
            
            if (!rows || rows.length < 2) {
                users = [];
                if (tbody) tbody.innerHTML = '<tr><td colspan="4">Нет участников</td></tr>';
                return;
            }
            
            users = [];
            for (let i = 1; i < rows.length; i++) {
                const r = rows[i].c;
                if (r && r[0] && r[0].v) {
                    users.push({
                        id: parseInt(r[0].v),
                        number: parseInt(r[6]?.v) || parseInt(r[0].v),
                        firstName: r[1]?.v || '',
                        lastName: r[2]?.v || '',
                        phone: r[3]?.v || ''
                    });
                }
            }
            users.sort((a,b) => a.number - b.number);
            
            if (tbody) {
                tbody.innerHTML = '';
                users.forEach(u => {
                    tbody.innerHTML += `<tr><td>${u.number}</td><td>${u.firstName}</td><td>${u.lastName}</td><td>${u.phone}</td></tr>`;
                });
            }
            
            const winnerNumbers = winners.map(w => w.number);
            available = users.filter(u => !winnerNumbers.includes(u.number));
            updateStatus();
        } catch(err) {
            console.error(err);
            if (tbody) tbody.innerHTML = '<tr><td colspan="4">Ошибка загрузки</td></tr>';
        }
    }
    
    function updateStatus() {
        const total = parseInt(document.getElementById('prizeCount').value);
        const left = total - winners.length;
        const div = document.getElementById('drawStatus');
        if (winners.length >= total) div.innerHTML = '✅ Розыгрыш завершён!';
        else if (available.length === 0) div.innerHTML = '⚠️ Нет участников для розыгрыша';
        else div.innerHTML = `🎲 Осталось ${left} призов | Доступно ${available.length} участников`;
    }
    
    function showWinner(winner, prizeNum) {
        const winnerDiv = document.getElementById('winnerAnnouncement');
        winnerDiv.innerHTML = `
            <h2>🏆 ПРИЗ №${prizeNum} 🏆</h2>
            <div class="winner-number">🎫 Номер участника: ${winner.number}</div>
            <div style="font-size:1.2rem;">${winner.firstName} ${winner.lastName}</div>
            <div style="margin-top:0.5rem;">✨ Поздравляем! ✨</div>
        `;
        winnerDiv.classList.remove('hidden');
        
        // Отправляем на экран зрителей
        localStorage.setItem('winnerDisplay', JSON.stringify({
            number: winner.number,
            name: `${winner.firstName} ${winner.lastName}`,
            prize: prizeNum,
            time: Date.now()
        }));
    }
    
    function drawWinner() {
        const total = parseInt(document.getElementById('prizeCount').value);
        if (winners.length >= total) {
            alert('Все призы разыграны');
            updateStatus();
            return;
        }
        if (available.length === 0) {
            alert('Нет участников для розыгрыша');
            updateStatus();
            return;
        }
        const randomIndex = Math.floor(Math.random() * available.length);
        const winner = available[randomIndex];
        available.splice(randomIndex, 1);
        winners.push(winner);
        showWinner(winner, winners.length);
        updateStatus();
    }
    
    document.getElementById('loginBtn').onclick = () => {
        if (document.getElementById('adminPassword').value === PASSWORD) {
            isAdmin = true;
            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('adminPanel').classList.remove('hidden');
            loadUsers();
        } else {
            document.getElementById('loginError').innerHTML = 'Неверный пароль';
            setTimeout(() => document.getElementById('loginError').innerHTML = '', 2000);
        }
    };
    
    document.getElementById('logoutBtn').onclick = () => {
        isAdmin = false;
        document.getElementById('loginCard').classList.remove('hidden');
        document.getElementById('adminPanel').classList.add('hidden');
    };
    
    document.getElementById('drawBtn').onclick = drawWinner;
    document.getElementById('prizeCount').onchange = updateStatus;
    document.getElementById('refreshBtn').onclick = loadUsers;
</script>
</body>
</html>
