<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Форма регистрации для участия в розыгрыше</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #0f766e, #1e3a8a);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  color:#fff;
}

.card{
  width:420px;
  padding:30px;
  border-radius:18px;
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(12px);
  box-shadow:0 10px 40px rgba(0,0,0,0.3);
}

h1{
  font-size:20px;
  text-align:center;
  margin-bottom:20px;
}

label{
  font-size:13px;
  opacity:0.9;
}

input, select{
  width:100%;
  padding:12px;
  margin-top:6px;
  margin-bottom:14px;
  border-radius:8px;
  border:none;
  outline:none;
}

input{
  background:white;
  color:black;
}

select{
  background:white;
  color:black;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#10b981;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

#msg{
  text-align:center;
  margin-top:15px;
}
</style>
</head>

<body>

<div class="card">

<h1>Форма регистрации для участия в розыгрыше</h1>

<label>Имя *</label>
<input id="name" placeholder="Введите имя">

<label>Фамилия *</label>
<input id="surname" placeholder="Введите фамилию">

<label>Телефон *</label>
<input id="phone" placeholder="Введите телефон">

<label>Email</label>
<input id="email" placeholder="Введите email">

<label>Хотите присоединиться к закрытому клубу путешественников?</label>
<select id="club">
  <option>Да</option>
  <option>Безусловно</option>
  <option>Несомненно</option>
  <option>В следующий раз</option>
</select>

<button onclick="send()">Зарегистрироваться</button>

<p id="msg"></p>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycby1wgwq3Ii6LZkHbv8O6tI97O-PBr2ci4ik9VsTtFc0RajqOm_NfiR-ajmp6vXGAgw_9g/exec";

async function send(){

  const data = {
    name: name.value,
    surname: surname.value,
    phone: phone.value,
    email: email.value,
    club: club.value
  };

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify(data)
    });

    const result = await res.json();

    if(result.status === "duplicate"){
      msg.innerText = "Вы уже зарегистрированы";
      return;
    }

    if(result.status === "full"){
      msg.innerText = "Регистрация закрыта (100/100)";
      return;
    }

    msg.innerText = "Готово! Ваш номер: " + result.number;

  } catch(e){
    msg.innerText = "Ошибка соединения с сервером";
  }
}
</script>

</body>
</html>
