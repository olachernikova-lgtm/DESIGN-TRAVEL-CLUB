<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>DESIGN TRAVEL CLUB — Регистрация и розыгрыш</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(145deg, #dbeae3 0%, #c4d3cb 100%);
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        .container { max-width: 600px; margin: 0 auto; }
        .card {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 2rem;
            padding: 1.75rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(90, 130, 110, 0.2);
        }
        h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1a4d3e;
            margin-bottom: 1rem;
            padding-left: 0.75rem;
            border-left: 5px solid #6b9c86;
        }
        .form-group { margin-bottom: 1.25rem; }
        label {
            display: block;
            font-weight: 500;
            color: #2b5b4a;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }
        input, button {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 2rem;
            border: 1px solid #cbdcd3;
            font-size: 1rem;
            background: white;
        }
        button {
            background: linear-gradient(95deg, #6b9c86, #4d7963);
            color: white;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }
        button:active { transform: scale(0.98); }
        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-top: 0.5rem;
        }
        .radio-group label {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: #edf6f1;
            padding: 0.7rem 1rem;
            border-radius: 2rem;
            border: 1px solid #d0e0d7;
            font-weight: normal;
            cursor: pointer;
        }
        .radio-group input {
            width: 1.2rem;
            height: 1.2rem;
            accent-color: #4d7963;
        }
        .status-message {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 1.5rem;
            text-align: center;
            font-size: 0.9rem;
        }
        .success { background: #e0f2e9; color: #1a5a48; border-left: 4px solid #2b8c6b; }
        .error { background: #ffe6e5; color: #bc4e4e; border-left: 4px solid #dc5f5f; }
        .info { background: #eef2fa; color: #2c5a6e; }
        .table-wrapper { overflow-x: auto; border-radius: 1rem; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th, td { padding: 0.6rem 0.4rem; text-align: left; border-bottom: 1px solid #d4e2db; }
        th { background-color: #e4f1eb; color: #2b5b4a; }
        .hidden { display: none; }
        .winner-block {
            background: linear-gradient(125deg, #e2f4ec, #d0e9de);
            border-radius: 2rem;
            padding: 2rem 1rem;
            text-align: center;
            border: 2px solid #4d7963;
            animation: gentlePop 0.4s ease-out;
        }
        @keyframes gentlePop {
            0% { transform: scale(0.96); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .winner-number { font-size: 3.5rem; font-weight: 800; color: #1a4d3e; letter-spacing: 4px; margin: 0.5rem 0; }
        .winner-name { font-size: 1.4rem; font-weight: 500; color: #2f604f; }
        @media (max-width: 500px) {
            .card { padding: 1.25rem; }
            .winner-number { font-size: 2.5rem; }
            .winner-name { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Блок победителя -->
    <div class="card">
        <h2>🍸 Коктейльный вечер · DESIGN TRAVEL CLUB</h2>
        <div id="winnerDisplayArea">
            <div class="status-message info" style="text-align: center;">✨ Здесь появится имя победителя ✨</div>
        </div>
    </div>

    <!-- ФОРМА РЕГИСТРАЦИИ -->
    <div class="card">
        <h2>📝 Регистрация на розыгрыш</h2>
        <form id="registrationForm">
            <div class="form-group">
                <label>Имя *</label>
                <input type="text" id="firstName" required placeholder="Например, Анна">
            </div>
            <div class="form-group">
                <label>Фамилия *</label>
                <input type="text" id="lastName" required placeholder="Например, Андреева">
            </div>
            <div class="form-group">
                <label>Телефон *</label>
                <input type="tel" id="phone" required placeholder="+7 900 123 45 67">
            </div>
            <div class="form-group">
                <label>✨ Хотите присоединиться к закрытому клубу путешественников и первыми узнавать о роскошных направлениях, уникальных маршрутах и эксклюзивных предложениях?</label>
                <div class="radio-group">
                    <label><input type="radio" name="club_interest" value="Да"> Да</label>
                    <label><input type="radio" name="club_interest" value="Безусловно"> Безусловно</label>
                    <label><input type="radio" name="club_interest" value="Несомненно"> Несомненно</label>
                    <label><input type="radio" name="club_interest" value="В следующий раз"> В следующий раз</label>
                </div>
            </div>
            <button type="submit">✨ Зарегистрироваться</button>
        </form>
        <div id="regFormStatus"></div>
    </div>

    <!-- ВХОД ОРГАНИЗАТОРА -->
    <div class="card" id="organizerLoginCard">
        <h2>🔐 Организатор розыгрыша</h2>
        <input type="password" id="adminPassword" placeholder="Введите пароль">
        <button id="loginToAdminBtn">Войти</button>
        <div id="loginErrorMsg" style="color: #bc4e4e; margin-top: 0.75rem;"></div>
    </div>

    <!-- ПАНЕЛЬ ОРГАНИЗАТОРА -->
    <div id="adminPanel" class="card hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem;">
            <h2 style="margin-bottom: 0;">🌿 Управление розыгрышем</h2>
            <button id="logoutAdminBtn" style="width: auto; background: #b1c5bb; color: #2b4b3e; padding: 0.4rem 1rem;">Выйти</button>
        </div>
        <div style="margin: 1.5rem 0 1rem 0;">
            <label style="display: inline-block; margin-right: 1rem;">🎁 Количество призов:</label>
            <select id="prizesCountSelect" style="width: auto; padding: 0.5rem 1rem;">
                <option value="1">1 приз</option>
                <option value="2" selected>2 приза</option>
                <option value="3">3 приза</option>
                <option value="5">5 призов</option>
            </select>
        </div>
        <button id="startDrawButton" style="background: #3a6d59; margin-bottom: 1rem;">🎲 РАЗЫГРАТЬ СЛЕДУЮЩИЙ ПРИЗ</button>
        <div id="drawInfoArea" class="status-message info">Статус: ожидание розыгрыша</div>

        <hr style="margin: 1.5rem 0; border-color: #d0dfd7;">
        <h3>📋 СПИСОК УЧАСТНИКОВ</h3>
        <div class="table-wrapper">
            <table id="participantsTable">
                <thead><tr><th>№</th><th>Имя</th><th>Фамилия</th><th>Телефон</th></tr></thead>
                <tbody id="participantsTableBody"><tr><td colspan="4">Загрузка...</td></tr></tbody>
            </table>
        </div>
        <button id="refreshListButton" style="margin-top: 1rem; background: #8db3a2;">🔄 Обновить список</button>
    </div>
</div>

<script>
    const ADMIN_PASSWORD = "travelclub2025";
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwv_aOPmeoxfy4BixpjeiX5F9Z6XT8_3KIz4qlIXMwi5IsMgESVOr3jbvmoC3uXkkqS/exec';
    const SHEET_ID = '1wN9aTVvbnmTwijUvRF21toueWWjmeUsUeQDCpQvZqEE';
    
    let participantsList = [];
    let remainingForDraw = [];
    let winnersList = [];
    let isAdmin = false;
    
    function normalizePhone(phone) {
        return String(phone).replace(/[\s\-\(\)\+]/g, '');
    }
    
    // ЗАГРУЗКА СПИСКА ИЗ ТАБЛИЦЫ
    async function loadParticipants() {
        const tbody = document.getElementById('participantsTableBody');
        if (tbody) tbody.innerHTML = '<tr><td colspan="4">🔄 Загрузка...</td></tr>';
        try {
            const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;
            const res = await fetch(url);
            const text = await res.text();
            const json = JSON.parse(text.substring(47, text.length - 2));
            const rows = json.table.rows;
            
            if (!rows || rows.length < 2) {
                participantsList = [];
                if (tbody) tbody.innerHTML = '<tr><td colspan="4">Нет участников</td></tr>';
                return;
            }
            
            participantsList = [];
            for (let i = 1; i < rows.length; i++) {
                const r = rows[i].c;
                if (r && r[0] && r[0].v) {
                    participantsList.push({
                        id: parseInt(r[0].v),
                        firstName: r[1]?.v || '',
                        lastName: r[2]?.v || '',
                        phone: r[3]?.v || '',
                        interest: r[4]?.v || '',
                        timestamp: r[5]?.v || ''
                    });
                }
            }
            participantsList.sort((a,b) => a.id - b.id);
            
            if (tbody) {
                tbody.innerHTML = '';
                participantsList.forEach(p => {
                    tbody.innerHTML += `<tr><td>${p.id}</td><td>${p.firstName}</td><td>${p.lastName}</td><td>${p.phone}</td></tr>`;
                });
            }
            
            // Обновляем розыгрыш
            const winnerIds = winnersList.map(w => w.id);
            remainingForDraw = participantsList.filter(p => !winnerIds.includes(p.id));
            
        } catch(err) {
            console.error(err);
            if (tbody) tbody.innerHTML = '<tr><td colspan="4">❌ Ошибка загрузки</td></tr>';
        }
    }
    
    // РЕГИСТРАЦИЯ
    async function register(formData) {
        const statusDiv = document.getElementById('regFormStatus');
        statusDiv.innerHTML = '<div class="status-message info">⏳ Отправка...</div>';
        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            });
            const result = await response.json();
            
            if (result.success) {
                statusDiv.innerHTML = `<div class="status-message success">✅ ${formData.firstName} ${formData.lastName}, вы зарегистрированы!<br>🎫 <strong>Ваш номер: ${result.id}</strong></div>`;
                setTimeout(() => statusDiv.innerHTML = '', 5000);
                if (isAdmin) setTimeout(loadParticipants, 1500);
                return true;
            } else if (result.error === 'duplicate_phone') {
                statusDiv.innerHTML = '<div class="status-message error">❌ Этот номер телефона уже зарегистрирован.</div>';
                setTimeout(() => statusDiv.innerHTML = '', 5000);
                return false;
            } else {
                throw new Error('Ошибка');
            }
        } catch(err) {
            statusDiv.innerHTML = '<div class="status-message error">❌ Ошибка отправки. Попробуйте ещё раз.</div>';
            setTimeout(() => statusDiv.innerHTML = '', 5000);
            return false;
        }
    }
    
    // РОЗЫГРЫШ
    function drawWinner() {
        const total = parseInt(document.getElementById('prizesCountSelect').value);
        
        if (winnersList.length >= total) {
            document.getElementById('drawInfoArea').innerHTML = '<div class="status-message info">🏆 Все призы разыграны!</div>';
            return;
        }
        
        if (remainingForDraw.length === 0) {
            document.getElementById('drawInfoArea').innerHTML = '<div class="status-message info">⚠️ Нет доступных участников</div>';
            return;
        }
        
        const randomIndex = Math.floor(Math.random() * remainingForDraw.length);
        const winner = remainingForDraw[randomIndex];
        remainingForDraw.splice(randomIndex, 1);
        winnersList.push(winner);
        
        // Показываем победителя
        document.getElementById('winnerDisplayArea').innerHTML = `
            <div class="winner-block">
                <h2>🏆 ПРИЗ №${winnersList.length} 🏆</h2>
                <div class="winner-number">🎫 № ${winner.id}</div>
                <div class="winner-name">${winner.firstName} ${winner.lastName}</div>
                <div>🎉 Поздравляем! 🎉</div>
            </div>
        `;
        
        document.getElementById('drawInfoArea').innerHTML = `<div class="status-message success">✅ Приз №${winnersList.length} — ${winner.firstName} ${winner.lastName} (№${winner.id})</div>`;
        
        if (winnersList.length >= total) {
            document.getElementById('drawInfoArea').innerHTML = '<div class="status-message info">🎊 Розыгрыш завершён! 🎊</div>';
        }
    }
    
    // ОБРАБОТЧИКИ
    document.getElementById('registrationForm').onsubmit = async (e) => {
        e.preventDefault();
        const firstName = document.getElementById('firstName').value.trim();
        const lastName = document.getElementById('lastName').value.trim();
        const phone = normalizePhone(document.getElementById('phone').value.trim());
        const interest = document.querySelector('input[name="club_interest"]:checked')?.value || '';
        
        if (!firstName || !lastName || !phone) {
            alert('Заполните имя, фамилию и телефон');
            return;
        }
        
        await register({ firstName, lastName, phone, interest, timestamp: new Date().toLocaleString() });
        document.getElementById('registrationForm').reset();
    };
    
    document.getElementById('loginToAdminBtn').onclick = () => {
        if (document.getElementById('adminPassword').value === ADMIN_PASSWORD) {
            isAdmin = true;
            document.getElementById('organizerLoginCard').classList.add('hidden');
            document.getElementById('adminPanel').classList.remove('hidden');
            loadParticipants();
        } else {
            document.getElementById('loginErrorMsg').innerText = 'Неверный пароль';
            setTimeout(() => document.getElementById('loginErrorMsg').innerText = '', 2000);
        }
    };
    
    document.getElementById('logoutAdminBtn').onclick = () => {
        isAdmin = false;
        document.getElementById('organizerLoginCard').classList.remove('hidden');
        document.getElementById('adminPanel').classList.add('hidden');
    };
    
    document.getElementById('startDrawButton').onclick = drawWinner;
    document.getElementById('refreshListButton').onclick = loadParticipants;
    
    loadParticipants();
</script>
</body>
</html>
