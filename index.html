<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>DESIGN TRAVEL CLUB — Регистрация</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(145deg, #dbeae3 0%, #c4d3cb 100%);
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        .container { max-width: 500px; margin: 0 auto; }
        .card {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 2rem;
            padding: 1.75rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(90, 130, 110, 0.2);
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #1a4d3e;
            text-align: center;
            margin-bottom: 0.5rem;
        }
        h2 {
            font-size: 1.2rem;
            font-weight: 400;
            color: #4d7963;
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .form-group { margin-bottom: 1.25rem; }
        label {
            display: block;
            font-weight: 500;
            color: #2b5b4a;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }
        input, button {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 2rem;
            border: 1px solid #cbdcd3;
            font-size: 1rem;
            background: white;
        }
        button {
            background: linear-gradient(95deg, #6b9c86, #4d7963);
            color: white;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }
        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-top: 0.5rem;
        }
        .radio-group label {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: #edf6f1;
            padding: 0.7rem 1rem;
            border-radius: 2rem;
            border: 1px solid #d0e0d7;
            font-weight: normal;
            cursor: pointer;
        }
        .radio-group input {
            width: 1.2rem;
            height: 1.2rem;
            accent-color: #4d7963;
        }
        .status-message {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 1.5rem;
            text-align: center;
            font-size: 0.9rem;
        }
        .success { background: #e0f2e9; color: #1a5a48; border-left: 4px solid #2b8c6b; }
        .error { background: #ffe6e5; color: #bc4e4e; border-left: 4px solid #dc5f5f; }
        .info { background: #eef2fa; color: #2c5a6e; }
        .number-big {
            font-size: 2.5rem;
            font-weight: 800;
            color: #1a4d3e;
            text-align: center;
            margin: 1rem 0;
        }
        iframe {
            display: none;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>🍸 Коктейльный вечер</h1>
        <h2>DESIGN TRAVEL CLUB</h2>
    </div>

    <div class="card">
        <form id="registrationForm" target="hiddenFrame" method="POST" action="https://script.google.com/macros/s/AKfycbwv_aOPmeoxfy4BixpjeiX5F9Z6XT8_3KIz4qlIXMwi5IsMgESVOr3jbvmoC3uXkkqS/exec">
            <div class="form-group">
                <label>Имя *</label>
                <input type="text" id="firstName" name="firstName" required placeholder="Анна">
            </div>
            <div class="form-group">
                <label>Фамилия *</label>
                <input type="text" id="lastName" name="lastName" required placeholder="Андреева">
            </div>
            <div class="form-group">
                <label>Телефон *</label>
                <input type="tel" id="phone" name="phone" required placeholder="+7 900 123 45 67">
            </div>
            <div class="form-group">
                <label>✨ Хотите присоединиться к закрытому клубу путешественников?</label>
                <div class="radio-group">
                    <label><input type="radio" name="interest" value="Да"> Да</label>
                    <label><input type="radio" name="interest" value="Безусловно"> Безусловно</label>
                    <label><input type="radio" name="interest" value="Несомненно"> Несомненно</label>
                    <label><input type="radio" name="interest" value="В следующий раз"> В следующий раз</label>
                </div>
            </div>
            <input type="hidden" name="timestamp" id="timestamp">
            <button type="submit">✨ Зарегистрироваться</button>
        </form>
        <div id="regFormStatus"></div>
    </div>
</div>

<iframe name="hiddenFrame" style="display:none;" onload="handleResponse()"></iframe>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwv_aOPmeoxfy4BixpjeiX5F9Z6XT8_3KIz4qlIXMwi5IsMgESVOr3jbvmoC3uXkkqS/exec';
    let submissionInProgress = false;
    
    function normalizePhone(phone) {
        return String(phone).replace(/[\s\-\(\)\+]/g, '');
    }
    
    document.getElementById('registrationForm').onsubmit = function(e) {
        e.preventDefault();
        
        const firstName = document.getElementById('firstName').value.trim();
        const lastName = document.getElementById('lastName').value.trim();
        let phone = document.getElementById('phone').value.trim();
        const interest = document.querySelector('input[name="interest"]:checked')?.value || '';
        const timestamp = new Date().toLocaleString();
        
        if (!firstName || !lastName || !phone) {
            alert('Заполните имя, фамилию и телефон');
            return false;
        }
        
        phone = normalizePhone(phone);
        
        // Подставляем значения в форму
        document.getElementById('timestamp').value = timestamp;
        
        // Меняем action на URL с параметрами (GET-запрос для обхода CORS)
        const form = document.getElementById('registrationForm');
        const params = new URLSearchParams();
        params.append('firstName', firstName);
        params.append('lastName', lastName);
        params.append('phone', phone);
        params.append('interest', interest);
        params.append('timestamp', timestamp);
        
        form.action = `${SCRIPT_URL}?${params.toString()}`;
        form.method = 'GET';
        
        const statusDiv = document.getElementById('regFormStatus');
        statusDiv.innerHTML = '<div class="status-message info">⏳ Отправка...</div>';
        submissionInProgress = true;
        
        form.submit();
        return true;
    };
    
    function handleResponse() {
        if (!submissionInProgress) return;
        submissionInProgress = false;
        
        const statusDiv = document.getElementById('regFormStatus');
        const firstName = document.getElementById('firstName').value.trim();
        const lastName = document.getElementById('lastName').value.trim();
        
        // Получаем номер участника (будет в ответе, но из-за iframe сложно)
        // Показываем успех
        statusDiv.innerHTML = `
            <div class="status-message success">
                ✅ ${firstName} ${lastName}, вы зарегистрированы!
                <div class="number-big">🎫 Спасибо за регистрацию!</div>
            </div>
        `;
        
        setTimeout(() => statusDiv.innerHTML = '', 8000);
        document.getElementById('registrationForm').reset();
    }
</script>
</body>
</html>
