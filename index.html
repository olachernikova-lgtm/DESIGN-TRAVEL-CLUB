<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESIGN TRAVEL CLUB — Коктейльный вечер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Roboto', 'Georgia', serif;
            background: linear-gradient(145deg, #d4e9e2 0%, #c2dfd0 100%);
            min-height: 100vh;
            padding: 30px 20px;
        }

        /* Основной контейнер */
        .main-container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Карточки — нежные, с тенью и скруглениями */
        .card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(2px);
            border-radius: 32px;
            padding: 30px;
            margin-bottom: 28px;
            box-shadow: 0 12px 28px rgba(0, 20, 10, 0.08);
            transition: all 0.3s ease;
            border: 1px solid rgba(120, 160, 130, 0.2);
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 32px rgba(0, 20, 10, 0.12);
            background: rgba(255, 255, 255, 0.96);
        }

        /* Заголовки */
        h2 {
            font-size: 1.8rem;
            font-weight: 500;
            letter-spacing: -0.3px;
            color: #2c5a4a;
            border-left: 5px solid #8bc7b2;
            padding-left: 18px;
            margin-bottom: 25px;
        }

        h3 {
            font-size: 1.4rem;
            font-weight: 500;
            color: #2c5a4a;
            margin-bottom: 20px;
        }

        /* Форма */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 500;
            color: #3b6e5c;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        input, button {
            width: 100%;
            padding: 12px 16px;
            border-radius: 24px;
            border: 1px solid #cde4db;
            font-size: 1rem;
            transition: all 0.2s;
            background: #ffffffd9;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: #7bc4a8;
            box-shadow: 0 0 0 3px rgba(100, 180, 140, 0.15);
        }

        button {
            background: linear-gradient(95deg, #86baa8 0%, #5f9e86 100%);
            color: white;
            font-weight: 600;
            border: none;
            cursor: pointer;
            margin-top: 10px;
            font-size: 1rem;
            letter-spacing: 0.5px;
            transition: 0.2s;
        }

        button:hover {
            background: linear-gradient(95deg, #6ea992 0%, #468a6f 100%);
            transform: scale(0.98);
            box-shadow: 0 6px 14px rgba(60, 100, 70, 0.2);
        }

        /* Радио-группа нежная */
        .radio-group {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            margin-top: 8px;
        }

        .radio-group label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: normal;
            background: #f2faf5;
            padding: 6px 16px;
            border-radius: 40px;
            border: 1px solid #cde4db;
            cursor: pointer;
            transition: 0.2s;
        }

        .radio-group input {
            width: 18px;
            accent-color: #5f9e86;
        }

        .radio-group label:hover {
            background: #e3f3ec;
        }

        /* Статус */
        .status {
            padding: 12px;
            border-radius: 32px;
            margin-top: 18px;
            text-align: center;
            font-size: 0.9rem;
        }

        .status.success {
            background: #dff0e9;
            color: #2a6b55;
            border-left: 4px solid #5f9e86;
        }

        /* Панель администратора */
        .admin-panel {
            background: #f4fbf7;
            border-radius: 28px;
            padding: 20px;
            margin-top: 20px;
            border: 1px solid #cbdfd6;
        }

        /* Таблица */
        .table-wrapper {
            overflow-x: auto;
            border-radius: 24px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 24px;
            overflow: hidden;
        }

        th, td {
            padding: 12px 12px;
            text-align: left;
            border-bottom: 1px solid #d9ece3;
        }

        th {
            background: #eaf5f0;
            color: #2c5a4a;
            font-weight: 600;
        }

        tr:hover td {
            background-color: #f6fef9;
        }

        /* Победитель */
        .winner-card {
            background: linear-gradient(125deg, #e2f4ed 0%, #d1e9df 100%);
            border-radius: 28px;
            padding: 24px;
            text-align: center;
            margin-top: 20px;
            border: 1px solid #b7d9cb;
            animation: softPop 0.4s ease;
        }

        @keyframes softPop {
            0% { opacity: 0; transform: scale(0.96);}
            100% { opacity: 1; transform: scale(1);}
        }

        /* Кнопка выхода */
        .logout-btn {
            background: #ccdbd4;
            color: #3b6e5c;
            width: auto;
            padding: 8px 24px;
            font-size: 0.85rem;
            margin-top: 0;
        }

        .logout-btn:hover {
            background: #b9cdc2;
            color: #1f4d3e;
        }

        .flex-right {
            text-align: right;
            margin-bottom: 20px;
        }

        /* Скрытые блоки */
        .hidden {
            display: none;
        }

        /* Нежные акценты */
        .accent-text {
            color: #4b8b74;
            font-style: italic;
        }

        hr {
            border: none;
            height: 1px;
            background: linear-gradient(90deg, transparent, #b7d9cb, transparent);
            margin: 20px 0;
        }

        @media (max-width: 680px) {
            .card { padding: 20px; }
            h2 { font-size: 1.5rem; }
            .radio-group { gap: 10px; }
        }
    </style>
</head>
<body>
<div class="main-container">

    <!-- КАРТОЧКА РЕГИСТРАЦИИ (видна всем) -->
    <div class="card">
        <h2>🍸 DESIGN TRAVEL CLUB <span style="font-weight: 300; font-size: 1.2rem;">| Коктейльный вечер</span></h2>
        <form id="registrationForm">
            <div class="form-group">
                <label>Имя *</label>
                <input type="text" id="first_name" required placeholder="Александра">
            </div>
            <div class="form-group">
                <label>Фамилия *</label>
                <input type="text" id="last_name" required placeholder="Черникова">
            </div>
            <div class="form-group">
                <label>Телефон *</label>
                <input type="tel" id="phone" required placeholder="+7 9XX XXX-XX-XX">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="hello@travelclub.ru">
            </div>
            <div class="form-group">
                <label>✨ Хотите присоединиться к закрытому клубу путешественников?</label>
                <div class="radio-group">
                    <label><input type="radio" name="club_interest" value="Да"> Да</label>
                    <label><input type="radio" name="club_interest" value="Безусловно"> Безусловно</label>
                    <label><input type="radio" name="club_interest" value="Несомненно"> Несомненно</label>
                    <label><input type="radio" name="club_interest" value="В следующий раз"> В следующий раз</label>
                </div>
            </div>
            <button type="submit">✨ Зарегистрироваться на вечер</button>
        </form>
        <div id="registerStatus"></div>
    </div>

    <!-- ФОРМА ВХОДА ДЛЯ ОРГАНИЗАТОРА -->
    <div id="loginContainer" class="card" style="text-align: center;">
        <h2>🔐 Организатор</h2>
        <p style="margin-bottom: 16px; color: #4b8b74;">Введите пароль, чтобы управлять розыгрышем</p>
        <input type="password" id="adminPassword" placeholder="Пароль" style="max-width: 280px; margin: 0 auto 12px;">
        <button class="login-btn" id="loginBtn" style="max-width: 200px;">Войти в панель</button>
        <div id="loginError" style="color: #c2706e; margin-top: 12px; font-size: 0.85rem;"></div>
    </div>

    <!-- ПАНЕЛЬ ОРГАНИЗАТОРА (скрыта по умолчанию) -->
    <div id="adminPanel" class="card hidden">
        <div class="flex-right">
            <button class="logout-btn" id="logoutBtn">🚪 Выйти</button>
        </div>
        <h2>🌿 Панель организатора</h2>

        <div class="admin-panel">
            <h3>🥂 Розыгрыш призов</h3>
            <button class="draw-btn" id="drawBtn" style="background: #88bca6;">🎲 Выбрать победителя</button>
            <div id="winnerResult"></div>
        </div>

        <div class="admin-panel">
            <h3>📜 Список гостей (Google Sheets)</h3>
            <button class="export-btn" id="exportBtn" style="background: #6fae94; margin-bottom: 16px;">📎 Скачать таблицу CSV</button>
            <div id="lastUpdate" style="font-size: 12px; color: #548e78; margin-bottom: 12px;"></div>
            <div class="table-wrapper">
                <table id="participantsTable">
                    <thead>
                        <tr><th>№</th><th>ФИО</th><th>Email</th><th>Телефон</th><th>Время регистрации</th><th>Интерес</th></tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="6" style="text-align: center; padding: 32px;">🔐 Авторизуйтесь, чтобы увидеть список участников</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // ⚠️ ИЗМЕНИТЕ ПАРОЛЬ НА СВОЙ
    const ADMIN_PASSWORD = "travelclub2025";
    const SPREADSHEET_ID = '1wN9aTVvbnmTwijUvRF21toueWWjmeUsUeQDCpQvZqEE';
    
    let participants = [];
    let isAdmin = false;

    // Сессия
    function checkSession() {
        if (sessionStorage.getItem('adminAuthenticated') === 'true') {
            isAdmin = true;
            showAdminPanel();
            loadFromGoogleSheets();
        }
    }

    function showAdminPanel() {
        document.getElementById('loginContainer').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
        isAdmin = true;
    }

    function hideAdminPanel() {
        document.getElementById('loginContainer').classList.remove('hidden');
        document.getElementById('adminPanel').classList.add('hidden');
        isAdmin = false;
        sessionStorage.removeItem('adminAuthenticated');
    }

    // Загрузка из Google Таблицы
    async function loadFromGoogleSheets() {
        if (!isAdmin) return;
        const tbody = document.getElementById('tableBody');
        const lastUpdateSpan = document.getElementById('lastUpdate');
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">🕊️ Загрузка...</td></tr>';
        
        try {
            const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json`;
            const response = await fetch(url);
            const text = await response.text();
            const jsonText = text.substring(47, text.length - 2);
            const data = JSON.parse(jsonText);
            const rows = data.table.rows;
            
            if (!rows || rows.length < 2) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">✨ Пока нет участников</td></tr>';
                participants = [];
                lastUpdateSpan.textContent = `Обновлено: ${new Date().toLocaleString()} | 0 гостей`;
                return;
            }
            
            const loaded = [];
            for (let i = 1; i < rows.length; i++) {
                const row = rows[i].c;
                if (row && row[0]?.v) {
                    loaded.push({
                        id: row[0]?.v || i,
                        name: row[1]?.v || '',
                        email: row[2]?.v || '',
                        phone: row[3]?.v || '',
                        timestamp: row[4]?.v || '',
                        interest: row[5]?.v || ''
                    });
                }
            }
            participants = loaded;
            tbody.innerHTML = '';
            participants.forEach(p => {
                const row = tbody.insertRow();
                row.insertCell(0).textContent = p.id;
                row.insertCell(1).textContent = p.name;
                row.insertCell(2).textContent = p.email;
                row.insertCell(3).textContent = p.phone;
                row.insertCell(4).textContent = p.timestamp;
                row.insertCell(5).textContent = p.interest || '—';
            });
            lastUpdateSpan.textContent = `🕊️ Обновлено: ${new Date().toLocaleString()} | участников: ${participants.length}`;
        } catch(err) {
            console.error(err);
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#b47c6e;">❌ Ошибка доступа к таблице</td></tr>';
        }
    }

    // Сохранение новой регистрации (локально + для админа)
    function saveRegistrationLocally(formData) {
        let offline = JSON.parse(localStorage.getItem('offline_registrations')) || [];
        offline.push(formData);
        localStorage.setItem('offline_registrations', JSON.stringify(offline));
        
        const statusDiv = document.getElementById('registerStatus');
        statusDiv.innerHTML = `<div class="status success">✅ ${formData.name}, вы зарегистрированы! Ждём вас на коктейльном вечере. 🍸</div>`;
        setTimeout(() => statusDiv.innerHTML = '', 5000);
        
        if (isAdmin) {
            participants.push(formData);
            updateAdminTable();
        }
    }
    
    function updateAdminTable() {
        if (!isAdmin) return;
        const tbody = document.getElementById('tableBody');
        if (!tbody) return;
        tbody.innerHTML = '';
        participants.forEach(p => {
            const row = tbody.insertRow();
            row.insertCell(0).textContent = p.id;
            row.insertCell(1).textContent = p.name;
            row.insertCell(2).textContent = p.email;
            row.insertCell(3).textContent = p.phone;
            row.insertCell(4).textContent = p.timestamp;
            row.insertCell(5).textContent = p.interest || '—';
        });
    }

    // === Обработчики ===
    document.getElementById('loginBtn').onclick = () => {
        const pwd = document.getElementById('adminPassword').value;
        if (pwd === ADMIN_PASSWORD) {
            sessionStorage.setItem('adminAuthenticated', 'true');
            isAdmin = true;
            showAdminPanel();
            loadFromGoogleSheets();
            document.getElementById('loginError').innerText = '';
        } else {
            document.getElementById('loginError').innerText = 'Неверный пароль';
        }
    };
    
    document.getElementById('logoutBtn').onclick = hideAdminPanel;
    
    // Регистрация
    document.getElementById('registrationForm').onsubmit = (e) => {
        e.preventDefault();
        const firstName = document.getElementById('first_name').value.trim();
        const lastName = document.getElementById('last_name').value.trim();
        const fullName = `${firstName} ${lastName}`;
        const phone = document.getElementById('phone').value.trim();
        const email = document.getElementById('email').value.trim();
        let interest = '';
        const selectedRadio = document.querySelector('input[name="club_interest"]:checked');
        if (selectedRadio) interest = selectedRadio.value;
        
        if (!firstName || !lastName || !phone) {
            alert('Пожалуйста, заполните имя, фамилию и телефон');
            return;
        }
        
        const newId = participants.length + 1;
        const newParticipant = {
            id: newId,
            name: fullName,
            email: email,
            phone: phone,
            timestamp: new Date().toLocaleString(),
            interest: interest
        };
        saveRegistrationLocally(newParticipant);
        e.target.reset();
        const bt = e.target.querySelector('button');
        bt.textContent = '✓ Готово!';
        setTimeout(() => bt.textContent = '✨ Зарегистрироваться на вечер', 2000);
    };
    
    // Розыгрыш (только админ)
    document.getElementById('drawBtn').onclick = () => {
        if (!isAdmin) { alert('Доступ только у организатора'); return; }
        if (participants.length === 0) { alert('Список гостей пуст'); return; }
        const winner = participants[Math.floor(Math.random() * participants.length)];
        document.getElementById('winnerResult').innerHTML = `
            <div class="winner-card">
                <h3>🏆 Победитель коктейльного вечера 🏆</h3>
                <p>🎫 №${winner.id} &nbsp;| ${winner.name}</p>
                <p>📞 ${winner.phone} &nbsp; ${winner.email ? '| '+winner.email : ''}</p>
                <p>⭐ ${winner.interest || 'Интерес к путешествиям'}</p>
                <p style="margin-top: 12px;">🥂 Поздравляем!</p>
            </div>
        `;
    };
    
    // Экспорт CSV
    document.getElementById('exportBtn').onclick = () => {
        if (!isAdmin) { alert('Только организатор'); return; }
        if (!participants.length) { alert('Нет данных'); return; }
        let csv = "№,ФИО,Email,Телефон,Время,Интерес\n";
        participants.forEach(p => {
            csv += `${p.id},"${p.name}",${p.email},${p.phone},${p.timestamp},"${p.interest || ''}"\n`;
        });
        const blob = new Blob(["\uFEFF" + csv], {type: 'text/csv'});
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'travelclub_guests.csv';
        link.click();
        URL.revokeObjectURL(link);
    };
    
    document.getElementById('adminPassword').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') document.getElementById('loginBtn').click();
    });
    
    checkSession();
</script>
</body>
</html>
