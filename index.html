<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>DESIGN TRAVEL CLUB — Розыгрыш</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(145deg, #dbeae3 0%, #c4d3cb 100%);
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
        }

        .card {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 2rem;
            padding: 1.75rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(90, 130, 110, 0.2);
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1a4d3e;
            margin-bottom: 1rem;
            padding-left: 0.75rem;
            border-left: 5px solid #6b9c86;
        }

        .status-message {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 1.5rem;
            text-align: center;
            font-size: 0.9rem;
        }

        .info {
            background: #eef2fa;
            color: #2c5a6e;
        }

        .form-iframe {
            width: 100%;
            border: none;
            border-radius: 1rem;
            background: transparent;
        }

        button {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 2rem;
            font-size: 1rem;
            background: #4d7963;
            color: white;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }

        .winner-block {
            background: linear-gradient(125deg, #e2f4ec, #d0e9de);
            border-radius: 2rem;
            padding: 2rem 1rem;
            text-align: center;
            border: 2px solid #4d7963;
        }

        .winner-name {
            font-size: 1.6rem;
            font-weight: 500;
            color: #1a4d3e;
            margin: 1rem 0;
        }

        input,
        select {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 2rem;
            border: 1px solid #cbdcd3;
            font-size: 1rem;
            background: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        th,
        td {
            padding: 0.6rem 0.4rem;
            text-align: left;
            border-bottom: 1px solid #d4e2db;
        }

        th {
            background-color: #e4f1eb;
            color: #2b5b4a;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Блок победителя -->
        <div class="card">
            <h2>🍸 Коктейльный вечер · DESIGN TRAVEL CLUB</h2>
            <div id="winnerDisplayArea">
                <div class="status-message info" style="text-align: center;">✨ Здесь появится имя победителя ✨</div>
            </div>
        </div>

        <!-- ВСТРОЕННАЯ GOOGLE ФОРМА -->
        <div class="card">
            <h2>📝 Регистрация на розыгрыш</h2>
            <iframe class="form-iframe" src="https://docs.google.com/forms/d/e/1xLVUd6Juf50im7fjKhe2z5Y_rp_7fhiTDM-O-4qsreA/viewform?embedded=true" width="100%" height="600" frameborder="0" marginheight="0" marginwidth="0">Загрузка...</iframe>
        </div>

        <!-- БЛОК ОРГАНИЗАТОРА (появляется после входа) -->
        <div class="card" id="organizerLoginCard">
            <h2>🔐 Организатор розыгрыша</h2>
            <input type="password" id="adminPassword" placeholder="Введите пароль">
            <button id="loginToAdminBtn">Войти в панель</button>
            <div id="loginErrorMsg" style="color: #bc4e4e; margin-top: 0.75rem;"></div>
        </div>

        <div id="adminPanel" class="card hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem;">
                <h2 style="margin-bottom: 0;">🌿 Управление розыгрышем</h2>
                <button id="logoutAdminBtn" style="width: auto; background: #b1c5bb; color: #2b4b3e; padding: 0.4rem 1rem;">Выйти</button>
            </div>
            <div style="margin: 1.5rem 0 1rem 0;">
                <label style="display: inline-block; margin-right: 1rem;">🎁 Количество призов:</label>
                <select id="prizesCountSelect" style="width: auto; padding: 0.5rem 1rem;">
                    <option value="1">1 приз</option>
                    <option value="2" selected>2 приза</option>
                    <option value="3">3 приза</option>
                    <option value="5">5 призов</option>
                </select>
            </div>
            <button id="startDrawButton" style="background: #3a6d59; margin-bottom: 1rem;">🎲 РАЗЫГРАТЬ СЛЕДУЮЩИЙ ПРИЗ</button>
            <div id="drawInfoArea" class="status-message info">Статус: ожидание розыгрыша</div>

            <hr style="margin: 1.5rem 0; border-color: #d0dfd7;">
            <h3>📋 СПИСОК УЧАСТНИКОВ</h3>
            <div class="table-wrapper">
                <table id="participantsTable">
                    <thead>
                        <tr>
                            <th>№</th>
                            <th>Имя</th>
                            <th>Фамилия</th>
                            <th>Телефон</th>
                        </tr>
                    </thead>
                    <tbody id="participantsTableBody">
                        <tr>
                            <td colspan="4">Загрузка...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <button id="refreshListButton" style="margin-top: 1rem; background: #8db3a2;">🔄 Обновить список</button>
        </div>
    </div>

    <script>
        // ПАРОЛЬ И ID ТАБЛИЦЫ
        const ADMIN_PASSWORD = "travelclub2025";
        const SHEET_ID = '1wN9aTVvbnmTwijUvRF21toueWWjmeUsUeQDCpQvZqEE';

        let participantsList = [];
        let remainingForDraw = [];
        let winnersList = [];

        // ЗАГРУЗКА УЧАСТНИКОВ ИЗ ТАБЛИЦЫ
        async function loadParticipants() {
            const tbody = document.getElementById('participantsTableBody');
            tbody.innerHTML = '<tr><td colspan="4">🔄 Загрузка...</td></tr>';
            try {
                // Публичный JSON-фид от Google Sheets
                const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;
                const response = await fetch(url);
                const text = await response.text();
                // Убираем первые 47 символов и последние 2 (обрезаем `google.visualization.Query.setResponse(` и `);`)
                const jsonText = text.substring(47, text.length - 2);
                const data = JSON.parse(jsonText);
                const rows = data.table.rows;

                if (!rows || rows.length < 2) {
                    participantsList = [];
                    tbody.innerHTML = '<tr><td colspan="4">Нет участников</td></tr>';
                    updateDrawStatus(); // Обновим статус на "нет участников"
                    return;
                }

                participantsList = [];
                // Начинаем с i=1, чтобы пропустить заголовки
                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i].c;
                    if (row && row[0] && row[0].v) {
                        participantsList.push({
                            id: i, // Номер участника
                            firstName: row[1]?.v || '',
                            lastName: row[2]?.v || '',
                            phone: row[3]?.v || ''
                        });
                    }
                }

                // Отрисовка таблицы
                tbody.innerHTML = '';
                participantsList.forEach(p => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${p.id}</td>
                            <td>${p.firstName}</td>
                            <td>${p.lastName}</td>
                            <td>${p.phone}</td>
                        </tr>`;
                });

                // Обновляем список доступных для розыгрыша
                const winnerIds = winnersList.map(w => w.id);
                remainingForDraw = participantsList.filter(p => !winnerIds.includes(p.id));
                updateDrawStatus();

            } catch (err) {
                console.error("Ошибка загрузки:", err);
                tbody.innerHTML = '<tr><td colspan="4">❌ Ошибка загрузки списка</td></tr>';
            }
        }

        function updateDrawStatus() {
            const total = parseInt(document.getElementById('prizesCountSelect').value);
            const left = total - winnersList.length;
            const statusDiv = document.getElementById('drawInfoArea');
            if (winnersList.length >= total) statusDiv.innerHTML = '✅ Розыгрыш завершён!';
            else if (remainingForDraw.length === 0) statusDiv.innerHTML = '⚠️ Нет участников для розыгрыша';
            else statusDiv.innerHTML = `🎲 Осталось ${left} призов | Доступно ${remainingForDraw.length} участников`;
        }

        function showWinner(winner, prizeNum) {
            // Показываем победителя в блоке для всех
            const winnerDiv = document.getElementById('winnerDisplayArea');
            winnerDiv.innerHTML = `
                <div class="winner-block">
                    <h2>🏆 ПРИЗ №${prizeNum} 🏆</h2>
                    <div class="winner-name">${winner.firstName} ${winner.lastName}</div>
                    <div>✨ Поздравляем! ✨</div>
                </div>
            `;
            // Сохраняем в localStorage, если есть отдельный экран зрителя
            localStorage.setItem('winnerDisplay', JSON.stringify({
                name: `${winner.firstName} ${winner.lastName}`,
                prize: prizeNum,
                time: Date.now()
            }));
        }

        function drawWinner() {
            const total = parseInt(document.getElementById('prizesCountSelect').value);
            if (winnersList.length >= total) {
                alert('Все призы уже разыграны!');
                updateDrawStatus();
                return;
            }
            if (remainingForDraw.length === 0) {
                alert('Нет доступных участников для розыгрыша');
                updateDrawStatus();
                return;
            }

            const randomIndex = Math.floor(Math.random() * remainingForDraw.length);
            const winner = remainingForDraw[randomIndex];
            remainingForDraw.splice(randomIndex, 1);
            winnersList.push(winner);
            showWinner(winner, winnersList.length);
            updateDrawStatus();
        }

        // --- Авторизация организатора ---
        document.getElementById('loginToAdminBtn').onclick = () => {
            const pwd = document.getElementById('adminPassword').value;
            if (pwd === ADMIN_PASSWORD) {
                document.getElementById('organizerLoginCard').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                loadParticipants(); // Загружаем список при входе
                // Сбросим список победителей при новом входе? Чтобы старые победители не мешали.
                winnersList = [];
                remainingForDraw = [];
            } else {
                document.getElementById('loginErrorMsg').innerText = 'Неверный пароль';
                setTimeout(() => document.getElementById('loginErrorMsg').innerText = '', 2000);
            }
        };

        document.getElementById('logoutAdminBtn').onclick = () => {
            document.getElementById('organizerLoginCard').classList.remove('hidden');
            document.getElementById('adminPanel').classList.add('hidden');
            // Небольшая очистка полей
            document.getElementById('adminPassword').value = '';
            document.getElementById('loginErrorMsg').innerText = '';
        };

        document.getElementById('startDrawButton').onclick = drawWinner;
        document.getElementById('refreshListButton').onclick = loadParticipants;
        document.getElementById('prizesCountSelect').onchange = updateDrawStatus;

        // Дополнительно: если организатор уже был залогинен на этом устройстве (опционально)
        // Здесь этого нет, чтобы каждый раз был вход.
    </script>
</body>
</html>
