<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Регистрация розыгрыша</title>

<style>
body{
  margin:0;
  font-family: Arial;
  background: linear-gradient(135deg, #0f766e, #1e3a8a);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:20px;
  color:#fff;
}

.card{
  width:100%;
  max-width:420px;
  padding:24px;
  border-radius:18px;
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(12px);
}

h1{
  font-size:18px;
  text-align:center;
}

input{
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:10px;
  border:none;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  margin-top:15px;
  border:none;
  border-radius:10px;
  background:#10b981;
  color:white;
  font-weight:bold;
  font-size:16px;
}

#msg{
  text-align:center;
  margin-top:10px;
}

/* ticket */
.ticket{
  text-align:center;
}

.number{
  font-size:52px;
  font-weight:bold;
  margin:10px 0;
  color:#a7f3d0;
}
</style>
</head>

<body>

<div class="card" id="card">

<h1>Регистрация на розыгрыш</h1>

<input id="name" placeholder="Имя">
<input id="surname" placeholder="Фамилия">
<input id="phone" placeholder="Телефон">
<input id="email" placeholder="Email">

<button onclick="send()" id="btn">Зарегистрироваться</button>

<p id="msg"></p>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycby1wgwq3Ii6LZkHbv8O6tI97O-PBr2ci4ik9VsTtFc0RajqOm_NfiR-ajmp6vXGAgw_9g/exec";

function showTicket(number, name, surname, phone){
  document.getElementById("card").innerHTML = `
    <div class="ticket">

      <h2>🎟 Счастливый билет</h2>

      <div class="number">${number}</div>

      <p><b>${name} ${surname}</b></p>
      <p>${phone}</p>

      <p style="opacity:0.7;margin-top:10px;">
        Ваш номер участника
      </p>

    </div>
  `;
}

async function send(){

  const btn = document.getElementById("btn");
  btn.disabled = true;
  btn.innerText = "Отправка...";

  const data = {
    name: document.getElementById("name").value.trim(),
    surname: document.getElementById("surname").value.trim(),
    phone: document.getElementById("phone").value.trim(),
    email: document.getElementById("email").value.trim()
  };

  if(!data.name || !data.surname || !data.phone){
    msg.innerText = "Заполните обязательные поля";
    btn.disabled = false;
    btn.innerText = "Зарегистрироваться";
    return;
  }

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify(data)
    });

    const result = await res.json();

    if(result.status === "duplicate"){
      msg.innerText = "Вы уже зарегистрированы";
      btn.disabled = false;
      btn.innerText = "Зарегистрироваться";
      return;
    }

    showTicket(result.number, data.name, data.surname, data.phone);

  } catch(e){
    msg.innerText = "Ошибка сервера";
    btn.disabled = false;
    btn.innerText = "Зарегистрироваться";
  }
}

</script>

</body>
</html>
