<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESIGN TRAVEL CLUB</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(145deg, #d4e9e2 0%, #c2dfd0 100%);
            min-height: 100vh;
            padding: 30px 20px;
        }
        .main-container { max-width: 1100px; margin: 0 auto; }
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 32px;
            padding: 30px;
            margin-bottom: 28px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(80, 140, 110, 0.2);
        }
        h2 {
            font-size: 1.8rem;
            color: #2c5a4a;
            border-left: 5px solid #8bc7b2;
            padding-left: 18px;
            margin-bottom: 25px;
        }
        h3 { font-size: 1.4rem; color: #2c5a4a; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 500; color: #3b6e5c; margin-bottom: 8px; }
        input, button, select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 24px;
            border: 1px solid #cde4db;
            font-size: 1rem;
            background: white;
        }
        button {
            background: linear-gradient(95deg, #86baa8 0%, #5f9e86 100%);
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        button:hover { opacity: 0.9; transform: scale(0.98); }
        .radio-group {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            margin-top: 8px;
        }
        .radio-group label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #f2faf5;
            padding: 6px 16px;
            border-radius: 40px;
            border: 1px solid #cde4db;
            cursor: pointer;
        }
        .status {
            padding: 12px;
            border-radius: 32px;
            margin-top: 18px;
            text-align: center;
        }
        .status.success { background: #dff0e9; color: #2a6b55; border-left: 4px solid #5f9e86; }
        .status.error { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .admin-panel { background: #f4fbf7; border-radius: 28px; padding: 20px; margin-top: 20px; }
        .winner-announcement {
            background: linear-gradient(125deg, #e2f4ed 0%, #d1e9df 100%);
            border-radius: 48px;
            padding: 40px;
            text-align: center;
            border: 3px solid #5f9e86;
        }
        .winner-number { font-size: 5rem; font-weight: bold; color: #2c5a4a; margin: 20px 0; }
        .winner-name { font-size: 2rem; margin: 15px 0; }
        .hidden { display: none; }
        .draw-step-btn { font-size: 1.3rem; padding: 15px; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 24px; overflow: hidden; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #d9ece3; }
        th { background: #eaf5f0; color: #2c5a4a; }
        .flex-right { text-align: right; margin-bottom: 20px; }
        .logout-btn, .reset-btn { width: auto; padding: 8px 24px; margin-left: 10px; }
        .reset-btn { background: #ccaa88; }
    </style>
</head>
<body>
<div class="main-container">

    <div class="card">
        <h2>🍸 Коктейльный вечер DESIGN TRAVEL CLUB</h2>
        <div id="publicWinnerContent"></div>
    </div>

    <div class="card">
        <form id="registrationForm">
            <div class="form-group"><label>Имя *</label><input type="text" id="first_name" required></div>
            <div class="form-group"><label>Фамилия *</label><input type="text" id="last_name" required></div>
            <div class="form-group"><label>Телефон *</label><input type="tel" id="phone" required></div>
            <div class="form-group"><label>Email</label><input type="email" id="email"></div>
            <div class="form-group">
                <label>✨ Хотите присоединиться к закрытому клубу путешественников?</label>
                <div class="radio-group">
                    <label><input type="radio" name="club_interest" value="Да"> Да</label>
                    <label><input type="radio" name="club_interest" value="Безусловно"> Безусловно</label>
                    <label><input type="radio" name="club_interest" value="Несомненно"> Несомненно</label>
                    <label><input type="radio" name="club_interest" value="В следующий раз"> В следующий раз</label>
                </div>
            </div>
            <button type="submit">✨ Зарегистрироваться</button>
        </form>
        <div id="registerStatus"></div>
    </div>

    <div id="loginContainer" class="card" style="text-align: center;">
        <h2>🔐 Организатор</h2>
        <input type="password" id="adminPassword" placeholder="Пароль" style="max-width: 280px; margin: 0 auto 12px;">
        <button id="loginBtn" style="max-width: 200px;">Войти</button>
        <div id="loginError" style="color: red; margin-top: 12px;"></div>
    </div>

    <div id="adminPanel" class="card hidden">
        <div class="flex-right">
            <button class="reset-btn" id="resetDrawBtn">🔄 Сбросить розыгрыш</button>
            <button class="logout-btn" id="logoutBtn">🚪 Выйти</button>
        </div>
        <h2>🌿 Панель организатора</h2>
        <div class="admin-panel">
            <h3>🎁 Розыгрыш</h3>
            <div style="display: flex; gap: 15px; margin-bottom: 20px;">
                <div style="flex:1"><label>Количество призов:</label><select id="prizeCount"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option><option value="5">5</option></select></div>
                <div style="flex:2"><label>Статус:</label><div id="drawStatus" style="background:#eaf5f0; padding: 10px; border-radius: 30px;">⏳ Ожидание</div></div>
            </div>
            <button class="draw-step-btn" id="drawStepBtn" disabled>🎲 Разыграть следующий приз</button>
            <div id="lastWinnerInfo" style="margin-top: 20px;"></div>
        </div>
        <div class="admin-panel">
            <h3>📜 История победителей</h3>
            <div id="winnersHistoryList" style="background:#f0f7f3; border-radius:20px; padding:15px;">Пока нет</div>
        </div>
        <div class="admin-panel">
            <h3>📋 Список участников</h3>
            <button id="exportBtn" style="background:#6fae94; margin-bottom:16px;">📎 Скачать CSV</button>
            <div style="overflow-x: auto;">
                <table><thead><tr><th>№</th><th>ФИО</th><th>Email</th><th>Телефон</th><th>Время</th><th>Интерес</th></tr></thead>
                <tbody id="tableBody"><tr><td colspan="6" style="text-align:center;">Войдите как организатор</td></tr></tbody>
            20~
            </div>
        </div>
    </div>
</div>

<script>
    const ADMIN_PASSWORD = "travelclub2025";
    const SPREADSHEET_ID = '1wN9aTVvbnmTwijUvRF21toueWWjmeUsUeQDCpQvZqEE';
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwv_aOPmeoxfy4BixpjeiX5F9Z6XT8_3KIz4qlIXMwi5IsMgESVOr3jbvmoC3uXkkqS/exec';
    
    let participants = [];
    let isAdmin = false;
    let available = [];
    let winners = [];
    let drawActive = false;
    
    function showStatus(msg, isError) {
        const div = document.getElementById('registerStatus');
        div.innerHTML = `<div class="status ${isError ? 'error' : 'success'}">${msg}</div>`;
        setTimeout(() => div.innerHTML = '', 5000);
    }
    
    function updateBigScreen(winner, prize) {
        localStorage.setItem('winnerDisplay', JSON.stringify({id: winner.id, name: winner.name, prize: prize, time: Date.now()}));
        document.getElementById('publicWinnerContent').innerHTML = `
            <div class="winner-announcement">
                <h2>🏆 ПРИЗ №${prize} 🏆</h2>
                <div class="winner-number">🎫 № ${winner.id}</div>
                <div class="winner-name">${winner.name}</div>
            </div>
        `;
    }
    
    async function loadData() {
        if (!isAdmin) return;
        document.getElementById('tableBody').innerHTML = '<tr><td colspan="6">Загрузка...</td></tr>';
        try {
            const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json`;
            const res = await fetch(url);
            const text = await res.text();
            const json = JSON.parse(text.substring(47, text.length - 2));
            const rows = json.table.rows;
            if (!rows || rows.length < 2) { participants = []; document.getElementById('tableBody').innerHTML = '<tr><td colspan="6">Нет участников</td></tr>'; return; }
            participants = [];
            for (let i = 1; i < rows.length; i++) {
                const r = rows[i].c;
                if (r && r[0]?.v) participants.push({id: parseInt(r[0].v), name: r[1]?.v || '', email: r[2]?.v || '', phone: r[3]?.v || '', timestamp: r[4]?.v || '', interest: r[5]?.v || ''});
            }
            participants.sort((a,b)=>a.id-b.id);
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            participants.forEach(p => { let row = tbody.insertRow(); row.insertCell(0).textContent = p.id; row.insertCell(1).textContent = p.name; row.insertCell(2).textContent = p.email; row.insertCell(3).textContent = p.phone; row.insertCell(4).textContent = p.timestamp; row.insertCell(5).textContent = p.interest || '—'; });
            resetDraw();
        } catch(e) { console.error(e); document.getElementById('tableBody').innerHTML = '<tr><td colspan="6">Ошибка</td></tr>'; }
    }
    
    function resetDraw() {
        available = [...participants];
        winners = [];
        drawActive = true;
        for (let i = available.length - 1; i > 0; i--) { let j = Math.floor(Math.random() * (i + 1)); [available[i], available[j]] = [available[j], available[i]]; }
        updateUI();
        document.getElementById('winnersHistoryList').innerHTML = '<div style="color:#8baa9c;">Пока нет победителей</div>';
        document.getElementById('publicWinnerContent').innerHTML = '';
        localStorage.setItem('winnerDisplay', JSON.stringify({clear: true}));
    }
    
    function updateUI() {
        const count = parseInt(document.getElementById('prizeCount').value);
        const left = count - winners.length;
        const btn = document.getElementById('drawStepBtn');
        const statusDiv = document.getElementById('drawStatus');
        if (!drawActive) { statusDiv.innerHTML = '⏸️ Нажмите "Сбросить"'; btn.disabled = true; return; }
        if (winners.length >= count) { statusDiv.innerHTML = '✅ Розыгрыш завершён'; btn.disabled = true; }
        else if (available.length === 0) { statusDiv.innerHTML = '⚠️ Нет участников'; btn.disabled = true; }
        else { statusDiv.innerHTML = `🎲 Осталось ${left} призов | Доступно ${available.length} чел`; btn.disabled = false; }
    }
    
    function drawWinner() {
        if (!drawActive) { alert('Нажмите "Сбросить розыгрыш"'); return; }
        const total = parseInt(document.getElementById('prizeCount').value);
        if (winners.length >= total) { alert('Все призы разыграны'); updateUI(); return; }
        if (available.length === 0) { alert('Нет участников'); updateUI(); return; }
        const winner = available[0];
        available = available.filter(p => p.id !== winner.id);
        winners.push(winner);
        const prizeNum = winners.length;
        updateBigScreen(winner, prizeNum);
        document.getElementById('lastWinnerInfo').innerHTML = `<div style="background:#dff0e9; border-radius:20px; padding:15px; text-align:center;"><strong>✅ Приз №${prizeNum}</strong><br>🏆 ${winner.name} (№${winner.id})</div>`;
        setTimeout(() => document.getElementById('lastWinnerInfo').innerHTML = '', 4000);
        let html = '';
        winners.forEach((w,i) => { html += `<div style="background:white; margin:8px 0; padding:10px; border-radius:15px;">🏆 Приз ${i+1} — №${w.id} — ${w.name}</div>`; });
        document.getElementById('winnersHistoryList').innerHTML = html;
        updateUI();
    }
    
    async function register(formData) {
        const statusDiv = document.getElementById('registerStatus');
        statusDiv.innerHTML = '<div class="status" style="background:#fff3cd;">⏳ Отправка...</div>';
        try {
            // Используем режим no-cors для обхода CORS
            await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            });
            
            // При no-cors мы не можем прочитать ответ, но запрос уходит
            // Показываем успех, но без номера (номер будет в таблице)
            statusDiv.innerHTML = `<div class="status success">✅ ${formData.name}, вы зарегистрированы!</div>`;
            setTimeout(() => statusDiv.innerHTML = '', 5000);
            
            // Обновляем данные для админа
            if (isAdmin) setTimeout(loadData, 1500);
            return true;
        } catch(e) {
            statusDiv.innerHTML = '<div class="status error">❌ Ошибка отправки</div>';
            setTimeout(() => statusDiv.innerHTML = '', 5000);
            return false;
        }
    }
    
    document.getElementById('loginBtn').onclick = () => {
        if (document.getElementById('adminPassword').value === ADMIN_PASSWORD) {
            sessionStorage.setItem('admin', 'true');
            isAdmin = true;
            document.getElementById('loginContainer').classList.add('hidden');
            document.getElementById('adminPanel').classList.remove('hidden');
            loadData();
        } else { document.getElementById('loginError').innerText = 'Неверный пароль'; }
    };
    document.getElementById('logoutBtn').onclick = () => {
        sessionStorage.removeItem('admin');
        isAdmin = false;
        document.getElementById('loginContainer').classList.remove('hidden');
        document.getElementById('adminPanel').classList.add('hidden');
    };
    document.getElementById('resetDrawBtn').onclick = () => { if(participants.length) resetDraw(); else alert('Нет участников'); };
    document.getElementById('drawStepBtn').onclick = drawWinner;
    document.getElementById('prizeCount').onchange = updateUI;
    document.getElementById('exportBtn').onclick = () => {
        if(!participants.length) { alert('Нет данных'); return; }
        let csv = "№,ФИО,Email,Телефон,Время,Интерес\n";
        participants.forEach(p => csv += `${p.id},"${p.name}",${p.email},${p.phone},${p.timestamp},"${p.interest}"\n`);
        const blob = new Blob(["\uFEFF" + csv], {type: 'text/csv'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'guests.csv';
        a.click();
        URL.revokeObjectURL(a.href);
    };
    document.getElementById('registrationForm').onsubmit = async (e) => {
        e.preventDefault();
        const name = `${document.getElementById('first_name').value.trim()} ${document.getElementById('last_name').value.trim()}`;
        const phone = document.getElementById('phone').value.trim();
        const email = document.getElementById('email').value.trim();
        let interest = '';
        const sel = document.querySelector('input[name="club_interest"]:checked');
        if(sel) interest = sel.value;
        if(!name || !phone) { alert('Заполните имя, фамилию и телефон'); return; }
        
        // Проверка дубликата через загруженные данные (если админ)
        if (isAdmin && participants.some(p => p.phone === phone)) {
            showStatus(`❌ Номер телефона ${phone} уже зарегистрирован!`, true);
            return;
        }
        if (isAdmin && participants.some(p => p.name === name)) {
            showStatus(`❌ Имя ${name} уже зарегистрировано!`, true);
            return;
        }
        
        await register({ name, phone, email, timestamp: new Date().toLocaleString(), interest });
        e.target.reset();
        document.querySelectorAll('input[name="club_interest"]').forEach(r=>r.checked=false);
        if (isAdmin) setTimeout(loadData, 2000);
    };
    if(sessionStorage.getItem('admin') === 'true') { isAdmin = true; document.getElementById('loginContainer').classList.add('hidden'); document.getElementById('adminPanel').classList.remove('hidden'); loadData(); }
</script>
</body>
</html>
