<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Большой экран — DESIGN TRAVEL CLUB</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(145deg, #d4e9e2 0%, #c2dfd0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .winner-card {
            background: rgba(255,255,255,0.95);
            border-radius: 60px;
            padding: 60px 40px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
            border: 3px solid rgba(80,140,110,0.3);
            max-width: 1200px;
            width: 100%;
            word-break: break-word;
        }
        h1 { font-size: 3rem; color: #2c5a4a; margin-bottom: 40px; }
        .prize { font-size: 2rem; background: #e2f4ed; display: inline-block; padding: 15px 40px; border-radius: 60px; margin-bottom: 40px; }
        .number { font-size: 12rem; font-weight: bold; color: #2c5a4a; margin: 30px 0; line-height: 1; }
        .name { font-size: 3rem; margin: 30px 0; color: #3b6e5c; word-break: break-word; }
        .waiting { font-size: 2rem; color: #8baa9c; padding: 60px 20px; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.5;} }
        @media (max-width: 768px) {
            .winner-card { padding: 30px 20px; border-radius: 40px; }
            h1 { font-size: 1.8rem; margin-bottom: 20px; }
            .prize { font-size: 1.2rem; padding: 10px 20px; margin-bottom: 20px; }
            .number { font-size: 4rem; margin: 15px 0; }
            .name { font-size: 1.5rem; margin: 15px 0; }
            .waiting { font-size: 1.2rem; padding: 30px 15px; }
        }
    </style>
</head>
<body>
<div class="winner-card">
    <h1>🍸 DESIGN TRAVEL CLUB</h1>
    <div id="content"><div class="waiting">🎫 Ожидание розыгрыша...</div></div>
</div>
<script>
    let lastId = null;
    let lastUpdateTime = 0;
    
    function show(id, name, prize) {
        const prizeText = prize ? `ПРИЗ №${prize}` : 'ПОБЕДИТЕЛЬ';
        document.getElementById('content').innerHTML = `
            <div class="prize">🏆 ${prizeText} 🏆</div>
            <div class="number">🎫 № ${id}</div>
            <div class="name">${name}</div>
            <div style="margin-top:40px; font-size:1.5rem;">✨ Поздравляем! ✨</div>
        `;
        lastId = id;
    }
    
    function clearDisplay() {
        const currentContent = document.getElementById('content').innerHTML;
        if (!currentContent.includes('Ожидание')) {
            document.getElementById('content').innerHTML = '<div class="waiting">🎫 Ожидание розыгрыша...</div>';
        }
        lastId = null;
    }
    
    function checkForUpdate() {
        const saved = localStorage.getItem('winnerDisplay');
        if (saved) {
            try {
                const data = JSON.parse(saved);
                if (data.clear) {
                    clearDisplay();
                } else if (data.id && data.id !== lastId && Date.now() - data.time < 60000) {
                    show(data.id, data.name, data.prize);
                }
            } catch(e) {}
        }
    }
    
    // Слушаем изменения localStorage (срабатывает для ДРУГИХ вкладок)
    window.addEventListener('storage', (event) => {
        if (event.key === 'winnerDisplay' && event.newValue) {
            try {
                const data = JSON.parse(event.newValue);
                if (data.clear) {
                    clearDisplay();
                } else if (data.id) {
                    show(data.id, data.name, data.prize);
                }
            } catch(e) {}
        }
    });
    
    // Проверяем каждые 300 мс для надёжности
    setInterval(checkForUpdate, 300);
    
    // Проверяем сразу при загрузке
    checkForUpdate();
</script>
</body>
</html>
