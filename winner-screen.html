<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESIGN TRAVEL CLUB — Розыгрыш | Большой экран</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Roboto', 'Georgia', serif;
            background: linear-gradient(145deg, #d4e9e2 0%, #c2dfd0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .screen-container {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        .winner-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(4px);
            border-radius: 80px;
            padding: 80px 60px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            border: 3px solid rgba(80, 140, 110, 0.3);
            animation: fadeIn 0.5s ease;
        }

        .winner-card h1 {
            font-size: 3.5rem;
            color: #2c5a4a;
            margin-bottom: 40px;
            font-weight: 500;
            letter-spacing: 3px;
        }

        .prize-badge {
            font-size: 2.5rem;
            background: #e2f4ed;
            display: inline-block;
            padding: 15px 50px;
            border-radius: 80px;
            margin-bottom: 50px;
            color: #2c5a4a;
            font-weight: bold;
        }

        .winner-number {
            font-size: 14rem;
            font-weight: bold;
            color: #2c5a4a;
            margin: 40px 0;
            letter-spacing: 15px;
            line-height: 1;
        }

        .winner-name {
            font-size: 4.5rem;
            margin: 40px 0;
            color: #3b6e5c;
            font-weight: 500;
        }

        .waiting-message {
            font-size: 3rem;
            color: #8baa9c;
            padding: 80px 20px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .waiting-animation {
            animation: pulse 2s infinite;
        }

        @media (max-width: 768px) {
            .winner-number { font-size: 6rem; letter-spacing: 5px; }
            .winner-name { font-size: 2rem; }
            .winner-card h1 { font-size: 2rem; }
            .waiting-message { font-size: 1.8rem; }
            .winner-card { padding: 40px 25px; border-radius: 40px; }
            .prize-badge { font-size: 1.5rem; padding: 10px 30px; }
        }
    </style>
</head>
<body>
<div class="screen-container">
    <div class="winner-card" id="winnerCard">
        <h1>🍸 DESIGN TRAVEL CLUB</h1>
        <div id="winnerContent">
            <div class="waiting-message waiting-animation">
                🎫 Ожидание розыгрыша...
            </div>
        </div>
    </div>
</div>

<script>
    function displayWinner(id, name, prizeNumber) {
        const prizeText = prizeNumber ? `ПРИЗ №${prizeNumber}` : 'ПОБЕДИТЕЛЬ';
        document.getElementById('winnerContent').innerHTML = `
            <div class="prize-badge">🏆 ${prizeText} 🏆</div>
            <div class="winner-number">🎫 № ${id}</div>
            <div class="winner-name">${decodeURIComponent(name)}</div>
            <div style="margin-top: 50px; font-size: 2rem; color: #8baa9c;">✨ Поздравляем! ✨</div>
        `;
    }

    // Слушаем изменения в localStorage от основной страницы
    function startListening() {
        // Проверяем при загрузке
        const saved = localStorage.getItem('winnerDisplay');
        if (saved) {
            try {
                const data = JSON.parse(saved);
                // Показываем только если данные не старше 1 минуты
                if (Date.now() - data.timestamp < 60000) {
                    displayWinner(data.id, data.name, data.prize);
                }
            } catch(e) {}
        }
        
        // Слушаем изменения
        window.addEventListener('storage', (event) => {
            if (event.key === 'winnerDisplay' && event.newValue) {
                try {
                    const data = JSON.parse(event.newValue);
                    displayWinner(data.id, data.name, data.prize);
                } catch(e) {}
            }
        });
    }
    
    startListening();
</script>
</body>
</html>
